    <style>
      :root {
        /* Professional easing curves (Apple-style spring) */
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent native scroll on body */
        overscroll-behavior-y: none; /* Prevent rubber-banding/pull-to-refresh on mobile */
        -webkit-tap-highlight-color: transparent;
        background-color: #EAEAE5;
        font-family: 'Inter', sans-serif;
      }

      #root {
        height: 100%;
        width: 100%;
      }

      @media (max-width: 640px) {
        body {
          background-color: #FDFCF6; /* Match card bg on mobile */
        }
      }

      /* Utility classes */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* GPU Accelerated Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translate3d(0, 10px, 0); }
        to { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.6s var(--ease-out-expo) forwards;
        will-change: opacity, transform;
      }

      @keyframes pulse-subtle {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.02); }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 2s infinite ease-in-out;
      }

      /* Touch adjustments */
      .touch-none {
        touch-action: none;
      }
      
      /* Safe area padding for iPhone Notch/Home Indicator */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
    </style>
